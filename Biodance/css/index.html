<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바이오던스</title>
    <link rel="stylesheet" href="../../css/default.css">
    <link rel="stylesheet" href="../../npm/swiper/swiper-bundle.min.css">
    <link rel="stylesheet" href="../../font/css/pretendardvariable.css">
    <link rel="stylesheet" href="main.css?v=00c75c8">
    <script src="../../npm/swiper/swiper-bundle.min.js"></script>
</head>
<body>
    <div id="wrap">
        <header class="site-header">
            <div class="promo-bar" aria-label="혜택 안내">
                <button type="button" class="promo-arrow promo-prev" aria-label="이전 혜택"><img src="../img/chevron-left.svg" alt=""></button>
                <p id="promo-message" aria-live="polite">첫구매 반값 50% 혜택</p>
                <button type="button" class="promo-arrow promo-next" aria-label="다음 혜택"><img src="../img/chevron-right.svg" alt=""></button>
            </div>
            <div class="header-main">
                <div class="header-inner">
                    <a class="brand-logo" href="index.html" aria-label="Biodance 홈"><img src="../img/logo-1.png" alt="Biodance"></a>
                    <nav class="main-nav" id="main-nav" aria-label="주요 메뉴">
                        <a href="#biodance" data-menu="biodance" aria-expanded="false">Biodance</a>
                        <a href="#product" data-menu="product" aria-expanded="false">Product</a>
                        <a href="#new">New</a>
                        <a href="#event">Event</a>
                        <a href="#community" data-menu="community" aria-expanded="false">Community</a>
                    </nav>
                    <div class="header-actions">
                        <a href="#mypage" aria-label="마이페이지" class="icon-link"><img src="../img/my.svg" alt=""></a>
                        <a href="#cart" aria-label="장바구니" class="icon-link"><img src="../img/card.svg" alt=""></a>
                        <button type="button" class="icon-link search-button" aria-label="검색"><img src="../img/search.svg" alt=""></button>
                        <button type="button" class="menu-toggle" aria-label="메뉴 열기" aria-expanded="false" aria-controls="main-nav"><span></span><span></span><span></span></button>
                    </div>
                </div>
            </div>
            <div class="header-mega-menu" id="header-mega-menu" hidden>
                <div class="mega-intro" data-panel="biodance">
                    <a href="#brand">Brand</a>
                    <a href="#key-ingredients">Key Ingredients</a>
                    <a href="#real-deep-mask">Real Deep Mask</a>
                </div>
                <div class="mega-column mega-primary" data-panel="product">
                    <a href="#best" data-submenu="menu_product">Best</a>
                    <a href="#new-products" data-submenu="menu_product">New</a>
                    <a href="#type" data-submenu="menu_product">유형별 <span>›</span></a>
                    <a href="#concern" data-submenu="menu_product2">고민별 <span>›</span></a>
                    <a href="#skin-type" data-submenu="menu_product3">피부타입별 <span>›</span></a>
                    <a href="#exclusive" data-submenu="menu_product4">공식몰 단독기획</a>
                    <a href="#promotion" data-submenu="menu_product">Promotion</a>
                </div>
                <div class="mega-column mega-secondary" data-panel="menu_product" hidden>
                    <a href="#mask">마스크팩</a><a href="#serum">세럼/토너</a><a href="#cream">크림</a><a href="#cleanser">클렌징</a><a href="#set">스킨케어</a>
                </div>
                <div class="mega-column mega-secondary" data-panel="menu_product2" hidden>
                    <a href="#moisture">모공/탄력</a><a href="#hydration">수분/보습</a><a href="#trouble">잡티/흔적</a><a href="#aging">영양/안티에이징</a><a href="#texture">트러블/진정</a><a href="#other">각질케어</a>
                </div>
                <div class="mega-column mega-secondary" data-panel="menu_product3" hidden>
                    <a href="#dry-skin">건성</a><a href="#oily-skin">중성/복합성</a><a href="#sensitive-skin">지성</a><a href="#all-skin">민감성</a>
                </div>
                <div class="mega-column mega-secondary" data-panel="menu_product4" hidden>
                    <a href="#exclusive-set">공식몰 단독 세트</a><a href="#limited">한정 기획</a><a href="#gift">증정 혜택</a>
                </div>
                <div class="mega-intro mega-community" data-panel="community" hidden>
                    <a href="#review">Review</a><a href="#notice">Notice</a><a href="#membership">Membership</a><a href="#stores">Global Stores</a><a href="#faq">FAQ</a>
                </div>
            </div>
        </header>
        <main>
            <section class="hero-sec" aria-label="바이오던스 주요 배너">
                <div class="swiper visual">
                    <div class="swiper-wrapper">
                        <div class="swiper-slide">
                            <img src="../img/Hero-1.png" alt="바이오던스 메인 배너 1" class="pc">
                            <img src="../img/mobile-1.png" alt="바이오던스 모바일 배너 1" class="mo">
                        </div>
                        <div class="swiper-slide">
                            <img src="../img/Hero-2.png" alt="바이오던스 메인 배너 2" class="pc">
                            <img src="../img/mobile-2.png" alt="바이오던스 모바일 배너 2" class="mo">
                        </div>
                        <div class="swiper-slide">
                            <img src="../img/Hero-3.png" alt="바이오던스 메인 배너 3" class="pc">
                            <img src="../img/mobile-3.png" alt="바이오던스 모바일 배너 3" class="mo">
                        </div>
                    </div>
                    <div class="hero-controls">
                        <div class="swiper-pagination"></div>
                        <div class="swiper-scrollbar" aria-hidden="true"></div>
                        <div class="hero-navigation">
                            <button type="button" class="swiper-button-prev" aria-label="이전 배너"></button>
                            <button type="button" class="swiper-button-next" aria-label="다음 배너"></button>
                        </div>
                    </div>
                </div>
            </section>
        </main>
        <footer>&copy; Biodance</footer>
    </div>
    <script>
        const promoMessage = document.querySelector('#promo-message');
        const promoPrev = document.querySelector('.promo-prev');
        const promoNext = document.querySelector('.promo-next');
        const promoMessages = ['첫구매 반값 50% 혜택', '회원 가입 시 5천원 즉시사용 쿠폰'];
        let promoIndex = 0;
        let promoTimer;

        function showPromoMessage(nextIndex) {
            promoMessage.classList.add('is-changing');
            window.setTimeout(() => {
                promoIndex = (nextIndex + promoMessages.length) % promoMessages.length;
                promoMessage.textContent = promoMessages[promoIndex];
                promoMessage.classList.remove('is-changing');
            }, 250);
        }

        function resetPromoTimer() {
            window.clearInterval(promoTimer);
            promoTimer = window.setInterval(() => {
                showPromoMessage(promoIndex + 1);
            }, 7000);
        }

        promoPrev.addEventListener('click', () => {
            showPromoMessage(promoIndex - 1);
            resetPromoTimer();
        });

        promoNext.addEventListener('click', () => {
            showPromoMessage(promoIndex + 1);
            resetPromoTimer();
        });

        resetPromoTimer();

        const menuToggle = document.querySelector('.menu-toggle');
        const mainNav = document.querySelector('#main-nav');
        const megaMenu = document.querySelector('#header-mega-menu');
        const menuLinks = mainNav.querySelectorAll('[data-menu]');
        const submenuLinks = megaMenu.querySelectorAll('[data-submenu]');

        function closeMegaMenu() {
            megaMenu.hidden = true;
            megaMenu.classList.remove('is-open', 'product-active', 'biodance-active', 'community-active', 'has-secondary-open');
            menuLinks.forEach(link => {
                link.classList.remove('is-active');
                link.setAttribute('aria-expanded', 'false');
            });
        }

        function openMegaMenu(menuName, activeLink) {
            megaMenu.hidden = false;
            megaMenu.classList.add('is-open');
            megaMenu.classList.toggle('product-active', menuName === 'product');
            megaMenu.classList.toggle('biodance-active', menuName === 'biodance');
            megaMenu.classList.toggle('community-active', menuName === 'community');

            megaMenu.querySelectorAll('[data-panel]').forEach(panel => {
                const panelName = panel.dataset.panel;
                panel.hidden = !['biodance', 'product', 'community'].includes(panelName);
            });

            megaMenu.querySelectorAll('.mega-secondary').forEach(panel => {
                panel.hidden = true;
            });
            megaMenu.querySelectorAll('[data-submenu]').forEach(item => {
                item.classList.remove('is-active');
            });

            menuLinks.forEach(link => {
                const active = link === activeLink;
                link.classList.toggle('is-active', active);
                link.setAttribute('aria-expanded', String(active));
            });
        }

        menuLinks.forEach(link => {
            link.addEventListener('click', event => {
                event.preventDefault();
                const alreadyOpen = !megaMenu.hidden && link.classList.contains('is-active');
                if (alreadyOpen) {
                    closeMegaMenu();
                    return;
                }
                openMegaMenu(link.dataset.menu, link);
            });
        });

        function selectSubmenu(link) {
            megaMenu.querySelectorAll('[data-submenu]').forEach(item => {
                item.classList.toggle('is-active', item === link);
            });
        }

        function toggleSecondaryMenu(link) {
            const selected = link.dataset.submenu;
            const target = megaMenu.querySelector('[data-panel="' + selected + '"]');
            if (!target) return;

            const shouldOpen = target.hidden;
            megaMenu.querySelectorAll('.mega-secondary').forEach(panel => {
                panel.hidden = true;
            });
            target.hidden = !shouldOpen;
            megaMenu.classList.toggle('has-secondary-open', shouldOpen);
            megaMenu.querySelectorAll('[data-submenu]').forEach(item => {
                item.classList.toggle('is-active', item === link);
            });
        }

        submenuLinks.forEach(link => {
            link.addEventListener('click', event => {
                event.preventDefault();
                selectSubmenu(link);
            });

            const arrow = link.querySelector('span');
            if (arrow) {
                arrow.setAttribute('role', 'button');
                arrow.setAttribute('tabindex', '0');
                arrow.setAttribute('aria-label', link.textContent.trim() + ' 하위 메뉴 열기');
                arrow.addEventListener('click', event => {
                    event.preventDefault();
                    event.stopPropagation();
                    toggleSecondaryMenu(link);
                });
                arrow.addEventListener('keydown', event => {
                    if (event.key === 'Enter' || event.key === ' ') {
                        event.preventDefault();
                        toggleSecondaryMenu(link);
                    }
                });
            }
        });

        document.addEventListener('click', event => {
            if (!event.target.closest('.site-header')) closeMegaMenu();
        });

        menuToggle.addEventListener('click', () => {
            const isOpen = mainNav.classList.toggle('is-open');
            menuToggle.setAttribute('aria-expanded', String(isOpen));
            menuToggle.setAttribute('aria-label', isOpen ? '메뉴 닫기' : '메뉴 열기');
            if (!isOpen) closeMegaMenu();
        });

        const swiperHero = new Swiper('.hero-sec .visual', {
            direction: 'horizontal',
            loop: true,
            pagination: {
                el: '.hero-sec .hero-controls .swiper-pagination',
                type: 'fraction',
                formatFractionCurrent: number => String(number).padStart(2, '0'),
                formatFractionTotal: number => String(number).padStart(2, '0'),
                renderFraction: (currentClass, totalClass) =>
                    '<span class="' + currentClass + '"></span>' +
                    '<span class="hero-pagination-line" aria-hidden="true"></span>' +
                    '<span class="' + totalClass + '"></span>',
            },
            navigation: {
                nextEl: '.visual .swiper-button-next',
                prevEl: '.visual .swiper-button-prev',
            },
            scrollbar: {
                el: '.visual .swiper-scrollbar',
                draggable: true,
            },
        });
    </script>
</body>
</html>
