<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바이오던스리뉴얼포트폴리오</title>
    <link rel="stylesheet" href="../../css/default.css">
    <link rel="stylesheet" href="../../npm/swiper/swiper-bundle.min.css">
    <link rel="stylesheet" href="../../font/css/pretendardvariable.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="main.css">
    <script src="../../npm/swiper/swiper-bundle.min.js"></script>
</head>
<body>
    <div id="wrap">
        <header>제목공간</header>
        <main>
            <div class="hero-sec">
                <div class="swiper visual">
                    <div class="swiper-wrapper">
                        <div class="swiper-slide">
                            <img src="../img/Hero-1.png" alt="바이오던스 PC 배너 1" class="pc">
                            <img src="../img/model-1.png" alt="바이오던스 모바일 배너 1" class="mo">
                        </div>
                        <div class="swiper-slide">
                            <img src="../img/Hero-2.png" alt="바이오던스 PC 배너 2" class="pc">
                            <img src="../img/model-2.png" alt="바이오던스 모바일 배너 2" class="mo">
                        </div>
                        <div class="swiper-slide">
                            <img src="../img/Hero-3.png" alt="바이오던스 PC 배너 3" class="pc">
                            <img src="../img/model-3.png" alt="바이오던스 모바일 배너 3" class="mo">
                        </div>
                    </div>

                    <!-- Figma Hero controls: current / progress line / total / arrows -->
                    <div class="hero-controls">
                        <div class="hero-pagination" aria-label="배너 진행 상태">
                            <span class="hero-pagination-current">01</span>
                            <div class="swiper-scrollbar" aria-label="배너 진행 막대"></div>
                            <span class="hero-pagination-total">03</span>
                        </div>
                        <div class="hero-navigation">
                            <button type="button" class="swiper-button-prev" aria-label="이전 배너"></button>
                            <button type="button" class="swiper-button-next" aria-label="다음 배너"></button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <footer>&copy;</footer>
    </div>
    <script>
        function updateHeroCounter(swiper) {
            const current = document.querySelector('.hero-pagination-current');
            const total = document.querySelector('.hero-pagination-total');
            const slideCount = swiper.slides.filter(
                slide => !slide.classList.contains('swiper-slide-duplicate')
            ).length;

            current.textContent = String(swiper.realIndex + 1).padStart(2, '0');
            total.textContent = String(slideCount).padStart(2, '0');
        }

        const swiperHero = new Swiper('.hero-sec > .swiper', {
            direction: 'horizontal',
            loop: true,
            navigation: {
                nextEl: '.visual .swiper-button-next',
                prevEl: '.visual .swiper-button-prev',
            },
            scrollbar: {
                el: '.visual .swiper-scrollbar',
                draggable: true,
            },
            on: {
                init: updateHeroCounter,
                slideChange: updateHeroCounter,
            },
        });
    </script>
</body>
</html>
